name: Build Release

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses & Install Components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Keystores and Properties
      run: |
        if [ -f "debug.keystore.base64" ]; then
          echo "Restoring debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f "debug.keystore" ]; then
          echo "Generating new debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
        fi

        if [ -f "release.keystore.base64" ]; then
          echo "Restoring release.keystore from base64..."
          base64 -d release.keystore.base64 > release.keystore
        elif [ ! -f "release.keystore" ]; then
          echo "Generating new release.keystore..."
          keytool -genkey -v -keystore release.keystore -storepass releasepass -alias releasekey -keypass releasepass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AnimeLib Release, OU=Development, O=AnimeLib, L=San Francisco, ST=California, C=US"
        fi
        
        if [ ! -f "keystore.properties" ]; then
          echo "Creating keystore.properties..."
          echo "storeFile=release.keystore" > keystore.properties
          echo "storePassword=releasepass" >> keystore.properties
          echo "keyAlias=releasekey" >> keystore.properties
          echo "keyPassword=releasepass" >> keystore.properties
        fi

    - name: Calculate and set release version from app/build.gradle
      id: versioning
      run: |
        CURRENT_VERSION=$(grep -E '(baseVersionName\s*=\s*"[^"]+"|versionName\s+"[^"]+")' app/build.gradle | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$CURRENT_VERSION" ]; then
          CURRENT_VERSION="1.8.9"
        fi
        echo "Current app base version in build.gradle: $CURRENT_VERSION"

        # Remove existing -beta or pre-release suffix
        CLEAN_VERSION=$(echo "$CURRENT_VERSION" | sed -E 's/-.*//')

        # Calculate +0.0.1 patch bump for GitHub Release tag with -beta suffix
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
        MAJOR=${MAJOR:-1}
        MINOR=${MINOR:-0}
        PATCH=${PATCH:-0}
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}-beta"
        NEW_TAG="v${NEW_VERSION_NAME}"

        echo "App Base Version: $CURRENT_VERSION"
        echo "GitHub Release Tag (+0.0.1-beta): $NEW_TAG"

        echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT
        echo "version_name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Build Debug & Release APK / AAB
      run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AnimeLib-APKs
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk

    - name: Create or Update GitHub Release
      if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.versioning.outputs.tag_name }}
        name: Release ${{ steps.versioning.outputs.tag_name }}
        draft: false
        prerelease: true
        overwrite: true
        make_latest: false
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/bundle/release/*.aab
